services:
  postgres:
    image: postgres:15-alpine
    container_name: apidapperclean-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ApiDapperCleanDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apidapperclean-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apidapperclean-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ApiDapperCleanDb;Username=postgres;Password=postgres
    ports:
      - "8080:80"
    networks:
      - apidapperclean-network

volumes:
  postgres_data:

networks:
  apidapperclean-network:
    driver: bridge
